<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 Days of Peace</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241B4E;
    --cream:#FFF9F2;
    --c1:#FF6B6B; --c1b:#FFEDEC;
    --c2:#2EC4B6; --c2b:#E7FBF9;
    --c3:#FFC857; --c3b:#FFF7E3;
    --c4:#6A4C93; --c4b:#F1EAFB;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    font-family:'Baloo 2',sans-serif;
    background:linear-gradient(160deg,#241B4E 0%,#5B3E8E 28%,#C05C6F 58%,#FF8C61 100%);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    position:relative;
    overflow-x:hidden;
  }
  .sun{
    position:absolute;
    width:480px;height:480px;
    border-radius:50%;
    background:radial-gradient(circle,#FFE9A8 0%,#FFC857 45%,transparent 72%);
    opacity:.55;
    top:-160px; left:50%; transform:translateX(-50%);
    filter:blur(2px);
    pointer-events:none;
  }
  .wrap{position:relative; width:100%; max-width:460px;}
  .card{
    background:var(--cream);
    border-radius:28px;
    padding:30px 26px 26px;
    box-shadow:0 24px 60px rgba(36,27,78,.35);
  }
  .top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px;
  }
  .daylabel{font-weight:700; font-size:.95rem; letter-spacing:.02em;}
  .dots{display:flex; gap:4px; flex-wrap:wrap; max-width:150px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#e7e0f5;}
  .dot.done{background:var(--accent,#6A4C93);}
  .dot.now{background:var(--accent,#6A4C93); width:9px;height:9px;}
  .ref{
    font-weight:700; font-size:1.05rem; margin:2px 0 12px;
    color:var(--accent,#6A4C93);
  }
  .verse{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:1.45rem;
    line-height:1.45;
    margin:0 0 20px;
  }
  .prayerbox{
    background:var(--accentbg,#F1EAFB);
    border-radius:16px;
    padding:16px 18px;
    font-size:.98rem;
    line-height:1.5;
  }
  .prayerbox b{display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; opacity:.65;}
  .anchor{
    text-align:center;
    color:#fff;
    font-size:.85rem;
    line-height:1.5;
    margin-top:22px;
    opacity:.9;
  }
  .anchor b{display:block; font-weight:600;}
  .nav{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:20px;
  }
  button{
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-size:.9rem;
    cursor:pointer;
    background:var(--accentbg,#F1EAFB);
    color:var(--accent,#6A4C93);
  }
  button:disabled{opacity:.35; cursor:default;}
  button.today{
    background:var(--accent,#6A4C93);
    color:#fff;
  }
  button:focus-visible{outline:2px solid #fff; outline-offset:2px;}
</style>
</head>
<body>
<div class="sun"></div>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div class="daylabel" id="daylabel">Day 1 of 30</div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="ref" id="ref"></div>
    <div class="verse" id="verse"></div>
    <div class="prayerbox">
      <b>Meditate &amp; pray</b>
      <span id="note"></span>
    </div>
    <div class="nav">
      <button id="prevBtn">← Prev</button>
      <button id="todayBtn" class="today">Today</button>
      <button id="nextBtn">Next →</button>
    </div>
  </div>
  <div class="anchor">
    <b>Isaiah 43:13</b>
    Your life is in God's hands — no one can undo what He has done.
  </div>
</div>

<script>
const DATA = [
{r:"Psalm 46:5",v:"God is in the midst of her, she shall not be moved; God shall help her, just at the break of dawn.",n:"Lord, You are near. Steady me this morning and help me lean on Your nearness instead of my fear."},
{r:"Psalm 46:10",v:"Be still, and know that I am God.",n:"Quiet my racing mind, Lord. Help me stop striving for a moment and simply know You are God."},
{r:"2 Corinthians 10:5",v:"Casting down imaginations… and bringing into captivity every thought to the obedience of Christ.",n:"Father, show me the anxious thought I'm believing today and help me take it captive in Your name."},
{r:"Isaiah 43:13",v:"Yea, before the day was I am he; and there is none that can deliver out of my hand: I will work, and who shall let it?",n:"Nothing can undo what You have done in my life, Lord. Rest my heart in that today."},
{r:"Philippians 4:6-7",v:"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God… shall keep your hearts and minds through Christ Jesus.",n:"I bring You what's worrying me, Lord, with thanks — and I receive the peace only You can give."},
{r:"Matthew 6:34",v:"Take therefore no thought for the morrow… Sufficient unto the day is the evil thereof.",n:"Help me stay in today, Lord, and trust You already hold tomorrow."},
{r:"1 Peter 5:7",v:"Casting all your care upon him; for he careth for you.",n:"I hand You my cares this morning, Father, because You truly care for me."},
{r:"John 14:27",v:"Peace I leave with you, my peace I give unto you… Let not your heart be troubled, neither let it be afraid.",n:"Your peace is different from the world's, Lord. Let it guard my heart today."},
{r:"Isaiah 26:3",v:"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.",n:"Fix my mind on You today, Lord, and keep me in that perfect peace."},
{r:"Psalm 94:19",v:"In the multitude of my thoughts within me thy comforts delight my soul.",n:"When my thoughts multiply, Lord, meet me there with Your comfort."},
{r:"Proverbs 12:25",v:"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.",n:"Speak a good word to my heart today, Lord, and lift what feels heavy."},
{r:"Psalm 55:22",v:"Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.",n:"I lay this burden down, Lord. Sustain me and keep me steady."},
{r:"Proverbs 3:5-6",v:"Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.",n:"Lord, I don't have to figure it all out. I trust You to direct my path today."},
{r:"Isaiah 41:10",v:"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.",n:"You are with me, Lord. Strengthen and uphold me today — I choose not to be afraid."},
{r:"Hebrews 11:1",v:"Now faith is the substance of things hoped for, the evidence of things not seen.",n:"Grow my faith, Lord, even for what I can't yet see You working out."},
{r:"Romans 8:28",v:"And we know that all things work together for good to them that love God, to them who are the called according to his purpose.",n:"I trust You are working even this for good, Lord, even when it's hard to see."},
{r:"Jeremiah 29:11",v:"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.",n:"Your plans for me are good, Lord. Help me rest in that instead of my worry."},
{r:"Psalm 56:3",v:"What time I am afraid, I will trust in thee.",n:"When fear rises today, Lord, let trust rise faster."},
{r:"2 Timothy 1:7",v:"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.",n:"This anxious spirit isn't from You, Lord. Fill me instead with Your power, love, and a sound mind."},
{r:"Psalm 37:5",v:"Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.",n:"I commit today's plans to You, Lord, and trust You to bring them to pass."},
{r:"Mark 11:24",v:"What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.",n:"Grow my faith when I pray, Lord — help me believe as I bring my requests to You."},
{r:"Habakkuk 3:19",v:"The LORD God is my strength, and he will make my feet like hinds' feet, and he will make me to walk upon mine high places.",n:"Be my strength today, Lord, and steady my steps through whatever is uneven."},
{r:"Psalm 139:16",v:"Thine eyes did see my substance… in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them.",n:"You saw me before I existed, Lord. My life was never out of Your hands."},
{r:"John 10:28-29",v:"And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand… none is able to pluck them out of my Father's hand.",n:"I am held in Your hand, Lord, and nothing can take me from it."},
{r:"Isaiah 46:4",v:"And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.",n:"You have carried me this far, Lord, and You will carry me still."},
{r:"Deuteronomy 31:6",v:"Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.",n:"You go with me today, Lord. Give me courage in place of fear."},
{r:"Psalm 121:1-2",v:"I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth.",n:"My help comes from You, Lord — not from figuring everything out myself."},
{r:"Lamentations 3:22-23",v:"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.",n:"Thank You for mercy that is new again this morning, Lord. Great is Your faithfulness."},
{r:"Psalm 27:1",v:"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?",n:"You are my light and my strength, Lord. There is nothing left for me to fear."},
{r:"Psalm 23:1",v:"The LORD is my shepherd; I shall not want.",n:"You lead me, Lord. I don't have to grasp for what I need — You are enough."},
];
const ACCENTS=[
  {a:"#FF6B6B",b:"#FFEDEC"},
  {a:"#2EC4B6",b:"#E7FBF9"},
  {a:"#FFC857",b:"#FFF7E3"},
  {a:"#6A4C93",b:"#F1EAFB"},
];

const KEY='scripture30_start';
let start = localStorage.getItem(KEY);
if(!start){ start = Date.now(); try{localStorage.setItem(KEY,start);}catch(e){} }
start = parseInt(start,10);
const todayIndex = Math.min(29, Math.max(0, Math.floor((Date.now()-start)/86400000)));

let current = todayIndex;

function render(){
  const d = DATA[current];
  const acc = ACCENTS[current%4];
  document.querySelector('.card').style.setProperty('--accent',acc.a);
  document.querySelector('.card').style.setProperty('--accentbg',acc.b);
  document.getElementById('daylabel').textContent = `Day ${current+1} of 30`;
  document.getElementById('ref').textContent = d.r;
  document.getElementById('verse').textContent = `"${d.v}"`;
  document.getElementById('note').textContent = d.n;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current>=todayIndex;
  document.getElementById('todayBtn').style.opacity = current===todayIndex ? '1':'.7';

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML='';
  for(let i=0;i<30;i++){
    const dot=document.createElement('div');
    dot.className='dot'+(i<=todayIndex?' done':'')+(i===current?' now':'');
    dotsEl.appendChild(dot);
  }
}
document.getElementById('prevBtn').onclick=()=>{ if(current>0){current--; render();} };
document.getElementById('nextBtn').onclick=()=>{ if(current<todayIndex){current++; render();} };
document.getElementById('todayBtn').onclick=()=>{ current=todayIndex; render(); };
render();
</script>
</body>
</html>
